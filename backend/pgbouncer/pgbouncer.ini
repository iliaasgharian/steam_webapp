; PgBouncer configuration.
; Sits between the backend and PostgreSQL: the backend connects to
; PgBouncer (cheap, fast to open/close), and PgBouncer maintains a
; small pool of real, long-lived connections to PostgreSQL itself.

[databases]
; Left-hand name is what clients connect to (see DATABASE_URL in
; docker-compose.yml: it points at "pgbouncer" host, database "steam_games").
; Right-hand host=db points at the actual PostgreSQL service.
steam_games = host=db port=5432 dbname=steam_games
pgbench_test = host=db port=5432 dbname=pgbench_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction pooling: a real PostgreSQL connection is only held for
; the duration of a single transaction, then returned to the pool for
; another client to use. This is what lets a small number of real
; connections serve a much larger number of concurrent clients.
pool_mode = transaction

; Real connections PgBouncer keeps open to PostgreSQL per database.
; Kept comfortably under PostgreSQL's own max_connections (200).
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 10

; How many clients PgBouncer itself will accept at once — this can be
; much higher than default_pool_size, since that's the whole point.
max_client_conn = 1000

; Logging (kept minimal; raise if debugging pool behavior)
admin_users = steam_user
stats_users = steam_user
