# Runs the backend and a PostgreSQL database together, wired to talk
# to each other automatically.
#
# Usage:
#   docker-compose up --build       (start both, rebuilding the backend image)
#   docker-compose down             (stop and remove both containers)
#   docker-compose down -v          (also delete the database's stored data)

services:
  db:
    image: postgres:16
    container_name: steam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: steam_user
      POSTGRES_PASSWORD: steam_password
      POSTGRES_DB: steam_games
    # Raised from the default 100 to give headroom above (workers x
    # pool_size+max_overflow) in app/database.py, plus room for
    # tools like psql/pgAdmin connecting separately.
    #
    # Additional tuning based on stress testing (pgbench):
    #   shared_buffers: PostgreSQL's own data cache. Default (128MB) is
    #     tiny; ~25% of available container RAM is a common starting
    #     point. Set to 2GB here assuming ~8GB is available to Docker/WSL.
    #   work_mem: per-operation memory for sorts/joins. Raised from the
    #     1-4MB default since many concurrent connections each doing
    #     small operations benefit from not spilling to disk.
    #   effective_cache_size: hint to the query planner about how much
    #     memory (including OS-level disk cache) is realistically
    #     available for caching — doesn't allocate anything itself.
    #   max_wal_size: lets more write-ahead-log accumulate between
    #     checkpoints, trading some crash-recovery time for fewer,
    #     less disruptive checkpoint pauses under heavy write load.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "max_wal_size=2GB"
    ports:
      # Exposed on the host too, in case you want to connect with a
      # GUI tool (e.g. pgAdmin, DBeaver) for a closer look.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam_user -d steam_games"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: steam-backend-container
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "db" below is the service name above — Docker Compose gives it
      # a DNS entry on the shared network automatically.
      DATABASE_URL: postgresql://steam_user:steam_password@db:5432/steam_games
    ports:
      - "9000:8000"

volumes:
  postgres_data:
